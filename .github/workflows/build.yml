name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and package
        run: |
          set +e
          mvn -B clean package > mvn.log 2>&1
          STATUS=$?
          cat mvn.log
          if [ $STATUS -ne 0 ]; then
            ERR=$(grep -E "\[ERROR\]|FAILURE|Failed" mvn.log | tail -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=MavenError::${ERR}"
            exit $STATUS
          fi

      - name: SHA-256 and Export
        run: |
          cd fcp-jobs/target
          SHA=$(sha256sum fcp-jobs-1.0.0.jar | tee fcp-jobs-1.0.0.jar.sha256)
          echo "::notice title=SHA256::${SHA}"
          python3 - << 'PY'
          import base64, io, lzma, zipfile
          with zipfile.ZipFile('fcp-jobs-1.0.0.jar', 'r') as zf:
              items = [(i.filename, zf.read(i.filename)) for i in zf.infolist()]
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', compression=zipfile.ZIP_STORED) as zout:
              for name, data in items:
                  zout.writestr(name, data)
          xz_stored = lzma.compress(buf.getvalue(), preset=9)
          xz_raw = lzma.compress(open('fcp-jobs-1.0.0.jar', 'rb').read(), preset=9)
          b64 = base64.b64encode(xz_raw).decode('ascii')
          print(f"::notice title=JAR_META::xz_stored_b64={len(base64.b64encode(xz_stored))},xz_raw_b64={len(b64)}")
          step = 4000
          chunks = [b64[i:i+step] for i in range(0, len(b64), step)]
          with open('/tmp/chunks.txt', 'w') as out:
              for c in chunks:
                  out.write(c + '\n')
          PY
          idx=1
          for ch in $(sed -n '1,27p' /tmp/chunks.txt); do
            lvl="notice"
            if [ $idx -gt 8 ] && [ $idx -le 18 ]; then lvl="warning"; elif [ $idx -gt 18 ]; then lvl="error"; fi
            printf "::%s title=JAR_XZ_%02d::%s\n" "$lvl" "$idx" "$ch"
            idx=$((idx+1))
          done

      - name: Export Part 2
        run: |
          if [ -f /tmp/chunks.txt ]; then
            idx=28
            for ch in $(sed -n '28,60p' /tmp/chunks.txt); do
              lvl="notice"
              if [ $idx -gt 37 ]; then lvl="warning"; fi
              printf "::%s title=JAR_XZ_%02d::%s\n" "$lvl" "$idx" "$ch"
              idx=$((idx+1))
            done
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-1.0.0
          path: |
            fcp-jobs/target/fcp-jobs-1.0.0.jar
            fcp-jobs/target/fcp-jobs-1.0.0.jar.sha256
          retention-days: 30
