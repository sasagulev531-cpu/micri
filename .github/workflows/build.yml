name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and package
        run: |
          set +e
          mvn -B clean package > mvn.log 2>&1
          STATUS=$?
          cat mvn.log
          if [ $STATUS -ne 0 ]; then
            ERR=$(grep -E "\[ERROR\]|FAILURE|Failed" mvn.log | tail -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=MavenError::${ERR}"
            exit $STATUS
          fi

      - name: SHA-256 and Export
        run: |
          cd fcp-jobs/target
          SHA=$(sha256sum fcp-jobs-1.0.0.jar | tee fcp-jobs-1.0.0.jar.sha256)
          echo "::notice title=SHA256::${SHA}"
          B64=$(base64 -w0 fcp-jobs-1.0.0.jar)
          LEN=${#B64}
          echo "::notice title=JAR_B64_1::${B64:0:30000}"
          if [ $LEN -gt 30000 ]; then
            echo "::notice title=JAR_B64_2::${B64:30000:30000}"
          fi
          if [ $LEN -gt 60000 ]; then
            echo "::notice title=JAR_B64_3::${B64:60000:30000}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-1.0.0
          path: |
            fcp-jobs/target/fcp-jobs-1.0.0.jar
            fcp-jobs/target/fcp-jobs-1.0.0.jar.sha256
          retention-days: 30
