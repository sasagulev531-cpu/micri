name: Build FCP-Jobs

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean package
      - name: Upload fcp-jobs jar
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-jar
          path: fcp-jobs/target/fcp-jobs-1.0.0.jar
          if-no-files-found: error
