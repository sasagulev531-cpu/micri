name: Build FCP-Jobs

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean package
      - name: Upload fcp-jobs jar
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-jar
          path: fcp-jobs/target/fcp-jobs-2.0.0.jar
          if-no-files-found: error
      - name: Prepare chunks
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          raw = pathlib.Path("fcp-jobs/target/fcp-jobs-2.0.0.jar").read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          b64 = base64.b64encode(lzma.compress(raw, preset=9)).decode("ascii")
          chunks = [b64[i:i+4000] for i in range(0, len(b64), 4000)]
          pathlib.Path("/tmp/chunks.json").write_text(json.dumps({"sha": sha, "len": len(raw), "chunks": chunks}))
          print(f"::notice title=SHA256::{sha}:{len(raw)}:{len(chunks)}")
          PY
      - name: Chunks 1-9
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(1, min(10, len(c)+1))]'
      - name: Chunks 10-18
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(10, min(19, len(c)+1))]'
      - name: Chunks 19-27
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(19, min(28, len(c)+1))]'
      - name: Chunks 28-36
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(28, min(37, len(c)+1))]'

  export2:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fcp-jobs-jar
      - name: Prepare chunks
        run: |
          python3 - <<'PY'
          import base64, json, lzma, pathlib
          raw = pathlib.Path("fcp-jobs-2.0.0.jar").read_bytes()
          b64 = base64.b64encode(lzma.compress(raw, preset=9)).decode("ascii")
          chunks = [b64[i:i+4000] for i in range(0, len(b64), 4000)]
          pathlib.Path("/tmp/chunks.json").write_text(json.dumps({"chunks": chunks}))
          PY
      - name: Chunks 37-45
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(37, min(46, len(c)+1))]'
      - name: Chunks 46-54
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(46, min(55, len(c)+1))]'
      - name: Chunks 55-63
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(55, min(64, len(c)+1))]'
      - name: Chunks 64-72
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(64, min(73, len(c)+1))]'
      - name: Chunks 73-81
        run: python3 -c 'import json; d=json.loads(open("/tmp/chunks.json").read()); c=d["chunks"]; [print(f"::notice title=JAR_{i:02d}_{len(c):02d}::{c[i-1]}") for i in range(73, min(82, len(c)+1))]'
