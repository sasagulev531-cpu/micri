name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and package
        run: |
          set +e
          mvn -B clean package > mvn.log 2>&1
          STATUS=$?
          cat mvn.log
          if [ $STATUS -ne 0 ]; then
            ERR=$(grep -E "\[ERROR\]|FAILURE|Failed" mvn.log | tail -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=MavenError::${ERR}"
            exit $STATUS
          fi

      - name: SHA-256 and Export
        run: |
          cd fcp-jobs/target
          SHA=$(sha256sum fcp-jobs-1.0.0.jar | tee fcp-jobs-1.0.0.jar.sha256)
          echo "::notice title=SHA256::${SHA}"
          python3 - << 'PY'
          import base64, gzip
          with open('fcp-jobs-1.0.0.jar', 'rb') as f:
              gz = gzip.compress(f.read(), compresslevel=9)
          b64 = base64.b64encode(gz).decode('ascii')
          step = 4000
          for idx, start in enumerate(range(0, min(len(b64), step * 9), step), 1):
              print(f"::notice title=JAR_GZ_{idx:02d}::{b64[start:start+step]}")
          for idx, start in enumerate(range(step * 9, len(b64), step), 10):
              print(f"::warning title=JAR_GZ_{idx:02d}::{b64[start:start+step]}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-1.0.0
          path: |
            fcp-jobs/target/fcp-jobs-1.0.0.jar
            fcp-jobs/target/fcp-jobs-1.0.0.jar.sha256
          retention-days: 30
