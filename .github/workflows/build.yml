name: Build FCP-Jobs

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B clean package
      - name: Upload fcp-jobs jar
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-jar
          path: fcp-jobs/target/fcp-jobs-1.0.0.jar
          if-no-files-found: error
      - name: Export jar part 1
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          raw = pathlib.Path("fcp-jobs/target/fcp-jobs-1.0.0.jar").read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          comp = lzma.compress(raw, preset=9)
          b64 = base64.b64encode(comp).decode("ascii")
          step = 4000
          chunks = [b64[i:i+step] for i in range(0, len(b64), step)]
          print(f"::notice title=SHA256::{sha}:{len(raw)}:{len(chunks)}")
          for idx, ch in enumerate(chunks[:27], 1):
              print(f"::notice title=JAR_{idx:02d}_{len(chunks):02d}::{ch}")
          PY

  export2:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fcp-jobs-jar
      - name: Export jar part 2
        run: |
          python3 - <<'PY'
          import base64, lzma, pathlib
          raw = pathlib.Path("fcp-jobs-1.0.0.jar").read_bytes()
          comp = lzma.compress(raw, preset=9)
          b64 = base64.b64encode(comp).decode("ascii")
          step = 4000
          chunks = [b64[i:i+step] for i in range(0, len(b64), step)]
          for idx in range(28, len(chunks) + 1):
              print(f"::notice title=JAR_{idx:02d}_{len(chunks):02d}::{chunks[idx-1]}")
          PY
