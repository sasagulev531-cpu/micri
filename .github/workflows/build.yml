name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and package
        run: |
          set +e
          mvn -B clean package > mvn.log 2>&1
          STATUS=$?
          cat mvn.log
          if [ $STATUS -ne 0 ]; then
            ERR=$(grep -E "\[ERROR\]|FAILURE|Failed" mvn.log | tail -n 60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=MavenError::${ERR}"
            exit $STATUS
          fi

      - name: SHA-256 and Export
        run: |
          cd fcp-jobs/target
          SHA=$(sha256sum fcp-jobs-1.0.0.jar | tee fcp-jobs-1.0.0.jar.sha256)
          echo "::notice title=SHA256::${SHA}"
          python3 - << 'PY'
          import base64, lzma, zipfile
          with zipfile.ZipFile('fcp-jobs-1.0.0.jar', 'r') as zf:
              raw_items = []
              for info in zf.infolist():
                  raw_items.append((info.filename, zf.read(info.filename)))
          import io
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', compression=zipfile.ZIP_STORED) as zout:
              for name, data in raw_items:
                  zout.writestr(name, data)
          xz = lzma.compress(open('fcp-jobs-1.0.0.jar', 'rb').read(), preset=9)
          b64 = base64.b64encode(xz).decode('ascii')
          print(f"::notice title=JAR_META::jar_bytes={len(open('fcp-jobs-1.0.0.jar','rb').read())},b64_len={len(b64)}")
          step = 4000
          chunks = [b64[i:i+step] for i in range(0, len(b64), step)]
          for idx, ch in enumerate(chunks, 1):
              level = "notice" if idx <= 8 else ("warning" if idx <= 18 else "error")
              print(f"::{level} title=JAR_XZ_{idx:02d}::{ch}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-1.0.0
          path: |
            fcp-jobs/target/fcp-jobs-1.0.0.jar
            fcp-jobs/target/fcp-jobs-1.0.0.jar.sha256
          retention-days: 30
