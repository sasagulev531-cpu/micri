name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests
        run: mvn -B -pl fcp-jobs -am test

      - name: Package
        run: mvn -B -pl fcp-jobs -am package

      - name: SHA-256
        run: |
          cd fcp-jobs/target
          sha256sum fcp-jobs-1.0.0.jar | tee fcp-jobs-1.0.0.jar.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcp-jobs-1.0.0
          path: |
            fcp-jobs/target/fcp-jobs-1.0.0.jar
            fcp-jobs/target/fcp-jobs-1.0.0.jar.sha256
          retention-days: 30
