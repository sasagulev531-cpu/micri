# ==============================================================================
# Настраиваемые добываемые узлы шахты (пример баланса — числа можно менять)
# ==============================================================================
mining:
  # Время восстановления истощённого узла по умолчанию (сек)
  cooldown-seconds: 45
  # Награда в монетах смены за полное прохождение всех стадий узла (пример баланса)
  node-reward-coins: 10
  # Цепочка стадий по умолчанию для новых узлов: Туф -> Камень -> Андезит
  stages:
    - TUFF
    - STONE
    - ANDESITE
  # Визуальный материал истощённого узла (после выдачи лута, пока идёт кулдаун)
  depleted-material: COBBLESTONE
  # Лут по умолчанию при полном разрушении последней стадии узла
  loot:
    - material: COBBLESTONE
      min: 2
      max: 4
      chance: 1.0
    - material: COAL
      min: 1
      max: 1
      chance: 0.25
  # Палитра материалов для переключения в GUI настройки узла (/miningnode)
  editable-materials:
    - TUFF
    - STONE
    - ANDESITE
    - COBBLESTONE
    - DEEPSLATE
    - COBBLED_DEEPSLATE
    - COAL_ORE
    - IRON_ORE
    - COPPER_ORE
    - GOLD_ORE
    - DIAMOND_ORE
    - EMERALD_ORE
  # Жёлтая контурная подсветка открытых граней активных узлов
  markers:
    enabled: true
    show-depleted: false
    radius: 24
    refresh-ticks: 40
    points-per-edge: 4

# ==============================================================================
# Настройка всех заданий и цепочек вынесена в отдельный конфиг:
#   plugins/FCP-Jobs/quests.yml
# Перезагрузка конфига заданий без рестарта сервера: /mnode reload
# ==============================================================================
